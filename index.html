<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sorteios e Proteção Veicular</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: barra fixa com 4 módulos; cada módulo é uma coluna central de até 1120px, grades que viram 1 coluna no celular */
:root{
  --bg:#f3f7f7; --surface:#ffffff; --surface2:#e6eff0; --ink:#0f2221; --muted:#53686a; --line:#d3e0e1;
  --brand:#007a75; --brand-ink:#ffffff; --accent:#f5a619; --accent-soft:#fef0d3;
  --ok:#1d7f47; --ok-soft:#e1f3e8; --warn:#9a6408; --warn-soft:#fbefd6; --bad:#b33a2e; --bad-soft:#f8e3e0;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a1515; --surface:#122120; --surface2:#192c2b; --ink:#e3efef; --muted:#90a7a7; --line:#24393a;
  --brand:#36c4ba; --brand-ink:#03201e; --accent:#f7b33a; --accent-soft:#3a2c0e;
  --ok:#58c98a; --ok-soft:#173326; --warn:#f0bd5a; --warn-soft:#382a10; --bad:#ef7d70; --bad-soft:#3b1a16; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a1515; --surface:#122120; --surface2:#192c2b; --ink:#e3efef; --muted:#90a7a7; --line:#24393a;
  --brand:#36c4ba; --brand-ink:#03201e; --accent:#f7b33a; --accent-soft:#3a2c0e;
  --ok:#58c98a; --ok-soft:#173326; --warn:#f0bd5a; --warn-soft:#382a10; --bad:#ef7d70; --bad-soft:#3b1a16; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(1.9rem,4vw,2.8rem);font-weight:800}
h2{font-size:1.5rem;font-weight:800}
h3{font-size:1.1rem;font-weight:600}
p{margin:0}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:10px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:1.15rem;color:var(--ink);text-decoration:none;margin-right:auto}
.logo svg{flex:none}
.logoimg{display:block;height:46px;width:auto;background:#fff;border-radius:6px;padding:2px 4px}
.aff{font:700 .72rem var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-left:1px solid var(--line);padding-left:10px}
.logocard{position:relative;z-index:1;background:#fff;border-radius:14px;padding:22px 26px;display:grid;justify-items:center;gap:8px;width:min(78%,340px);box-shadow:0 12px 30px rgba(0,0,0,.18)}
.logocard img{width:100%;max-width:240px;height:auto}
.logocard span{font:800 .8rem var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:#0e5a44}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{font:600 .9rem var(--f-body);border:0;background:none;color:var(--muted);padding:8px 12px;border-radius:999px;cursor:pointer}
nav button[aria-current="page"]{background:var(--brand);color:var(--brand-ink)}
nav button:hover:not([aria-current]){background:var(--surface2);color:var(--ink)}
main{padding-block:28px 64px}
.view{display:grid;gap:24px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.eyebrow{font:700 .72rem var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--brand)}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr))}
button,.btn{font:600 .92rem var(--f-body);border-radius:8px;padding:10px 16px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn-p{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn-a{background:var(--accent);border-color:var(--accent);color:#1c1300}
.btn-g{border-color:transparent;background:none;color:var(--brand);padding-inline:6px}
.btn-sm{padding:6px 10px;font-size:.82rem}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
label{display:grid;gap:4px;font-weight:600;font-size:.85rem}
input,select,textarea{font:500 .95rem var(--f-body);padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%;min-width:0}
textarea{resize:vertical;min-height:70px}
.pill{display:inline-flex;align-items:center;gap:6px;font:700 .72rem var(--f-body);letter-spacing:.04em;text-transform:uppercase;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.p-info{background:var(--surface2);color:var(--muted)}
.bar{height:10px;background:var(--surface2);border-radius:999px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .sold{background:var(--brand)}
.bar .res{background:var(--accent)}
.demo-note{background:var(--accent-soft);color:var(--ink);border-radius:8px;padding:10px 14px;font-size:.88rem}
/* campanhas */
.camp{display:grid;gap:14px}
.camp .prize{display:flex;gap:14px;align-items:center}
.ticket{flex:none;width:58px;height:58px;border-radius:10px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font:800 1.2rem var(--f-display);position:relative}
.ticket::after{content:"";position:absolute;right:-5px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:var(--surface)}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:.88rem}
.kv b{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.numgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:6px}
.n{font:600 .85rem var(--f-mono);padding:8px 0;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.n.sel{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.n.res{background:var(--accent-soft);border-color:transparent;color:var(--warn);cursor:not-allowed;text-decoration:line-through}
.n.sold{background:var(--surface2);border-color:transparent;color:var(--muted);cursor:not-allowed;text-decoration:line-through}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block;border:1px solid var(--line)}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.stepper button{border:0;border-radius:0;padding:8px 14px;font-size:1.1rem}
.stepper input{border:0;border-radius:0;width:70px;text-align:center;font-family:var(--f-mono)}
.detail{display:grid;gap:20px;grid-template-columns:minmax(0,1fr) 340px;align-items:start}
@media (max-width:860px){.detail{grid-template-columns:minmax(0,1fr)}}
.sticky{position:sticky;top:80px}
.radio{display:flex;gap:8px}
.radio label{flex:1;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:10px;cursor:pointer;font-weight:600}
.radio input{width:auto}
.radio label:has(input:checked){border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
/* painel */
.kpi{display:grid;gap:4px}
.kpi .v{font:700 1.6rem var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .l{font-size:.8rem;color:var(--muted);font-weight:600}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--surface2)}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}
tfoot td{font-weight:700;background:var(--surface2)}
.split{display:flex;height:14px;border-radius:999px;overflow:hidden;background:var(--surface2)}
.split .pix{background:var(--brand)}
.split .card{background:var(--accent)}
/* sorteio */
.stage{background:var(--brand);color:var(--brand-ink);border-radius:14px;padding:28px 20px;display:grid;gap:16px;justify-items:center;text-align:center;overflow:hidden;position:relative}
.reel{display:flex;gap:8px}
.digit{width:clamp(48px,11vw,84px);height:clamp(70px,15vw,116px);border-radius:10px;background:var(--surface);color:var(--ink);display:grid;place-items:center;font:700 clamp(2.2rem,7vw,4rem) var(--f-mono);box-shadow:inset 0 -6px 0 rgba(0,0,0,.08)}
.stage.spin .digit{animation:shake .12s infinite}
@keyframes shake{50%{transform:translateY(-3px)}}
.ball{width:clamp(110px,26vw,150px);aspect-ratio:1;max-width:100%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 18%,var(--accent) 60%,#b06f00 100%);display:grid;place-items:center;color:#1c1300;font:800 clamp(1.8rem,6vw,2.6rem) var(--f-mono);box-shadow:0 10px 24px rgba(0,0,0,.25)}
.stage.spin .ball{animation:tumble .5s infinite linear}
@keyframes tumble{0%{transform:rotate(0) translateY(0)}25%{transform:rotate(90deg) translateY(-8px)}50%{transform:rotate(180deg)}75%{transform:rotate(270deg) translateY(-6px)}100%{transform:rotate(360deg)}}
.tray{display:flex;flex-wrap:wrap;gap:8px}
.tray span{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font:700 .82rem var(--f-mono);background:var(--accent-soft);color:var(--warn);border:2px solid var(--accent)}
.tray span.first{background:var(--accent);color:#1c1300}
.winner{background:var(--surface);color:var(--ink);border-radius:10px;padding:14px 18px;display:grid;gap:2px;min-width:min(100%,320px)}
.chips{display:flex;flex-wrap:wrap;gap:5px;max-height:220px;overflow:auto;padding:2px}
.chips span{font:600 .78rem var(--f-mono);padding:3px 7px;border-radius:5px;background:var(--surface2)}
.chips span.out{opacity:.35;text-decoration:line-through}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;background:var(--surface)}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
/* empresa */
.hero{display:grid;gap:28px;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);align-items:center}
@media (max-width:800px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero p.lead{font-size:1.1rem;color:var(--muted);max-width:56ch;margin-top:12px}
.banner{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);background:#008b86;border-radius:14px;overflow:hidden;min-height:300px}
.banner-photo{width:100%;height:100%;object-fit:cover;object-position:left center;display:block}
.banner-text{position:relative;display:grid;align-content:center;justify-items:center;gap:26px;padding:28px 24px;color:#fff}
.banner-line{display:flex;align-items:center;gap:0;font:400 clamp(1.15rem,2.3vw,1.7rem)/1.25 var(--f-body);color:#fff}
.banner-line .ind{padding-left:1.6em}
.banner-line strong{font:800 italic clamp(1.25rem,2.6vw,1.95rem)/1.3 var(--f-display);letter-spacing:.01em}
.plus{flex:none;width:clamp(64px,8vw,104px);aspect-ratio:1;max-width:100%;margin-right:-.9em;background:#f5a619;clip-path:polygon(34% 0,66% 0,66% 34%,100% 34%,100% 66%,66% 66%,66% 100%,34% 100%,34% 66%,0 66%,0 34%,34% 34%);border-radius:6px}
.banner-line>span:last-child{position:relative}
.banner-cta{background:#f5a619;color:#3b3b3b;font:800 italic .95rem var(--f-body);text-transform:uppercase;letter-spacing:.03em;padding:12px 22px;border-radius:4px;text-decoration:none}
.banner-text::before{content:"";position:absolute;left:-30px;top:0;bottom:0;width:44px;background:linear-gradient(90deg,#008b86 0 30%,#f5a619 30% 48%,#008b86 48% 62%,#fff 62% 74%,#008b86 74%);transform:skewX(-12deg)}
@media (max-width:760px){.banner-text::before{display:none}}
.banner-cta:hover{background:#ffb733}
@media (max-width:760px){.banner{grid-template-columns:minmax(0,1fr)}.banner-photo{aspect-ratio:16/9;height:auto;max-width:100%}}
.shieldart{background:var(--brand);border-radius:16px;aspect-ratio:4/3;max-width:100%;display:grid;place-items:center;position:relative;overflow:hidden}
.shieldart::before{content:"";position:absolute;inset:auto -10% -30% -10%;height:55%;background:repeating-linear-gradient(90deg,var(--accent) 0 40px,transparent 40px 80px);opacity:.35;transform:perspective(200px) rotateX(55deg)}
.section{display:grid;gap:16px}
.svc{display:grid;gap:8px}
.svc .ic{width:42px;height:42px;border-radius:10px;background:var(--surface2);display:grid;place-items:center;color:var(--brand)}
.benef{display:grid;gap:28px 20px;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}
.benef article{display:grid;justify-items:center;text-align:center;gap:6px;align-content:start}
.benef .tile{width:84px;height:84px;border-radius:8px;background:#008b86;color:#f5a619;display:grid;place-items:center;margin-bottom:6px}
.benef h3{font:800 .95rem var(--f-display);text-transform:uppercase;letter-spacing:.02em;color:var(--brand)}
.benef p{color:var(--muted);font-size:.9rem;max-width:34ch}
.gallery{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.ph{aspect-ratio:4/3;max-width:100%;border-radius:10px;background:repeating-linear-gradient(135deg,var(--surface2) 0 12px,var(--surface) 12px 24px);border:1px dashed var(--line);display:grid;place-items:center;text-align:center;padding:12px;color:var(--muted);font-size:.85rem}
blockquote{margin:0;display:grid;gap:10px}
blockquote p{font-size:1rem}
details{border-bottom:1px solid var(--line);padding:12px 0}
details summary{cursor:pointer;font-weight:700}
details p{margin-top:8px;color:var(--muted);max-width:70ch}
.contact{display:grid;gap:10px}
.contact div{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.contact dt{font-weight:700;min-width:96px}
.contact dd{margin:0}
ul.clean{margin:0;padding-left:18px;display:grid;gap:6px}
/* modal / toast */
.modal{position:fixed;inset:0;background:rgba(5,12,9,.55);display:grid;place-items:center;z-index:20;padding:16px}
.modal .box{background:var(--surface);border-radius:14px;padding:22px;width:min(440px,100%);max-height:90vh;overflow:auto;display:grid;gap:14px}
.qr{width:180px;height:180px;max-width:100%;image-rendering:pixelated;border-radius:8px;background:#fff;padding:8px;justify-self:center}
.code{font:500 .72rem var(--f-mono);word-break:break-all;background:var(--surface2);padding:8px;border-radius:6px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;z-index:30;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
(function(){
const KEY='sorteios-proto-v1';
const COMPANY={nome:'Prosul Afiliado SJB',whats:'(11) 90000-0000',whatsLink:'5511900000000',email:'contato@exemplo.com.br',endereco:'Av. Exemplo, 1000 – Centro, São Paulo/SP',horario:'Seg a sex, 8h às 18h · Sáb, 8h às 12h · Assistência 24h'};
const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>[...el.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const int=v=>v.toLocaleString('pt-BR');
const pct=v=>(v*100).toLocaleString('pt-BR',{maximumFractionDigits:1})+'%';
const dt=t=>new Date(t).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'});
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const maskPhone=p=>String(p).replace(/\d(?=\d{4})/g,'•');
// Aleatório justo (rejeição para evitar viés de módulo)
function rnd(n){const a=new Uint32Array(1),lim=Math.floor(0x100000000/n)*n;do{crypto.getRandomValues(a)}while(a[0]>=lim);return a[0]%n}
function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}

/* ---------- dados ---------- */
let S;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):null}catch(e){return null}}
function seed(){
  const now=Date.now(),H=3600e3;
  const names=['Ana Paula Souza','Bruno Ferreira','Carla Mendes','Diego Rocha','Eduarda Lima','Fábio Nascimento','Gabriela Torres','Henrique Alves','Isabela Martins','João Pedro Costa','Karen Ribeiro','Lucas Oliveira','Mariana Santos','Nelson Pereira','Olívia Carvalho','Paulo Henrique Dias','Rafaela Gomes','Sérgio Barbosa','Tatiane Moreira','Vinícius Araújo','Wesley Cardoso','Yasmin Teixeira'];
  const st={cfg:{taxaPix:0.0099,taxaCartao:0.0499,taxaCartaoFixa:0.39,expiraMin:30},campaigns:[],orders:[],draws:[],ui:{open:null,page:0,drawCamp:null,style:'roleta'}};
  st.campaigns.push({id:'c1',titulo:'Moto 0 km',premio:'Honda CG 160 Start 0 km, documentada',descricao:'Campanha de exemplo. Sorteio agendado e transmitido ao vivo.',preco:5,total:1000,maxPedido:200,modo:'agendado',drawAt:now+3*24*H,estilo:'roleta',status:'ativa',criada:now-10*24*H,autoFeito:false});
  st.campaigns.push({id:'c2',titulo:'Jogo de pneus + revisão',premio:'4 pneus aro 14 e revisão completa na oficina parceira',descricao:'Campanha de exemplo com sorteio manual estilo bingo.',preco:2.5,total:300,maxPedido:50,modo:'manual',drawAt:null,estilo:'bingo',status:'ativa',criada:now-6*24*H,autoFeito:false});
  const fill=(c,count)=>{
    const free=shuffle(Array.from({length:c.total},(_,i)=>i+1));let k=0;
    for(let i=0;i<count;i++){
      const q=1+rnd(i%5===0?20:6),nums=free.slice(k,k+q);k+=q;
      const r=rnd(100),status=r<78?'pago':r<90?'pendente':'cancelado';
      const created=status==='pendente'?now-rnd(20)*60e3:now-rnd(9*24)*H;
      const nm=names[rnd(names.length)];
      st.orders.push({id:uid('P'),campaignId:c.id,nome:nm,fone:'119'+String(10000000+rnd(89999999)),numeros:status==='cancelado'?[]:nums,numerosOrig:nums,valor:+(q*c.preco).toFixed(2),metodo:rnd(100)<68?'pix':'cartao',status,criado:created,pagoEm:status==='pago'?created+rnd(30)*60e3:null,exemplo:true});
      if(status==='cancelado')k-=q;
    }
  };
  fill(st.campaigns[0],70);fill(st.campaigns[1],34);
  return st;
}
S=load()||seed();
if(!S.ui)S.ui={open:null,page:0,drawCamp:null,style:'roleta'};

function campOrders(cid){return S.orders.filter(o=>o.campaignId===cid)}
function numberMap(cid){ // número -> {status, order}
  const m=new Map();
  for(const o of campOrders(cid)){if(o.status==='cancelado')continue;for(const n of o.numeros)m.set(n,{st:o.status==='pago'?'sold':'res',o})}
  return m;
}
function campStats(c){
  const m=numberMap(c.id);let sold=0,res=0;for(const v of m.values())v.st==='sold'?sold++:res++;
  return {sold,res,free:c.total-sold-res};
}
function expirePending(){
  const lim=Date.now()-S.cfg.expiraMin*60e3;let ch=0;
  for(const o of S.orders)if(o.status==='pendente'&&o.criado<lim){o.status='cancelado';o.motivo='Reserva expirada';o.numeros=[];ch++}
  if(ch)save();
}
function feeOf(o){return o.status!=='pago'?0:o.metodo==='pix'?o.valor*S.cfg.taxaPix:o.valor*S.cfg.taxaCartao+S.cfg.taxaCartaoFixa}
const pad=(n,c)=>String(n).padStart(String(c.total).length,'0');

/* ---------- navegação ---------- */
const VIEWS=['sorteios','painel','sorteio','empresa'];
let current='sorteios';
function go(v){
  if(!VIEWS.includes(v))v='sorteios';current=v;
  for(const x of VIEWS)$('#v-'+x).hidden=x!==v;
  $$('nav button').forEach(b=>b.dataset.go===v?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current'));
  try{history.replaceState(null,'','#'+v)}catch(e){}
  render();window.scrollTo(0,0);
}
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){e.preventDefault();go(g.dataset.go)}});
function render(){expirePending();({sorteios:rSorteios,painel:rPainel,sorteio:rSorteio,empresa:rEmpresa})[current]()}

function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2600)}
function modal(html){$('#modalbox').innerHTML=html;$('#modal').hidden=false}
function closeModal(){$('#modal').hidden=true}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});

/* ---------- 1. Sorteios ---------- */
let sel=new Set(),showForm=false;
const PAGE=200;
function statusPill(c){
  const done=S.draws.some(d=>d.campaignId===c.id);
  if(c.status==='encerrada')return '<span class="pill p-info">Encerrada</span>';
  if(done)return '<span class="pill p-ok">Sorteada</span>';
  return c.modo==='agendado'?`<span class="pill p-warn">Sorteio ${dt(c.drawAt)}</span>`:'<span class="pill p-ok">Vendas abertas</span>';
}
function progress(c,st){
  return `<div class="bar" role="img" aria-label="${pct(st.sold/c.total)} vendido"><i class="sold" style="width:${st.sold/c.total*100}%"></i><i class="res" style="width:${st.res/c.total*100}%"></i></div>
  <div class="kv"><span class="muted">${int(st.sold)} vendidos · ${int(st.res)} reservados</span><b>${pct((st.sold)/c.total)}</b></div>`;
}
function rSorteios(){
  const el=$('#v-sorteios');
  const c=S.campaigns.find(x=>x.id===S.ui.open);
  if(c)return rDetail(el,c);
  el.innerHTML=`
  <div class="row between">
    <div><div class="eyebrow">Campanhas</div><h1>Concorra a prêmios para o seu carro</h1></div>
    <button class="btn-a" id="newCamp">${showForm?'Fechar formulário':'+ Nova campanha (admin)'}</button>
  </div>
  <p class="demo-note">Protótipo: os pagamentos são simulados e os dados ficam salvos só neste navegador. As campanhas e pedidos já carregados são exemplos.</p>
  ${showForm?campForm():''}
  <div class="grid g2">${S.campaigns.map(c=>{const st=campStats(c);return `
    <article class="panel camp">
      <div class="prize"><div class="ticket">${esc(c.titulo.trim()[0]||'#')}</div><div style="min-width:0"><h3>${esc(c.titulo)}</h3><p class="muted small">${esc(c.premio)}</p></div></div>
      <div class="row">${statusPill(c)}<span class="pill p-info">${c.estilo==='bingo'?'Bingo':'Roleta'}</span></div>
      ${progress(c,st)}
      <div class="kv"><span>Preço por número</span><b>${brl(c.preco)}</b></div>
      <div class="kv"><span>Disponíveis</span><b>${int(st.free)} de ${int(c.total)}</b></div>
      <button class="btn-p" data-open="${c.id}" ${c.status!=='ativa'?'disabled':''}>Escolher números</button>
    </article>`}).join('')}</div>`;
  $('#newCamp').onclick=()=>{showForm=!showForm;rSorteios()};
  $$('[data-open]',el).forEach(b=>b.onclick=()=>{S.ui.open=b.dataset.open;S.ui.page=0;sel=new Set();save();rSorteios();window.scrollTo(0,0)});
  const f=$('#campForm',el);
  if(f){
    const modoSel=$('#cf-modo',f),when=$('#cf-when',f);
    modoSel.onchange=()=>when.hidden=modoSel.value!=='agendado';

function drawQR(canvas,text){
  const N=29,ctx=canvas.getContext('2d');canvas.width=canvas.height=N;ctx.fillStyle='#fff';ctx.fillRect(0,0,N,N);ctx.fillStyle='#000';
  let h=2166136261;const next=()=>{h^=h<<13;h^=h>>>17;h^=h<<5;return h>>>0};for(const ch of text)h=Math.imul(h^ch.charCodeAt(0),16777619);
  for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(next()%2)ctx.fillRect(x,y,1,1);
  for(const [ox,oy] of [[0,0],[N-7,0],[0,N-7]]){ctx.fillStyle='#000';ctx.fillRect(ox,oy,7,7);ctx.fillStyle='#fff';ctx.fillRect(ox+1,oy+1,5,5);ctx.fillStyle='#000';ctx.fillRect(ox+2,oy+2,3,3)}
}

    <label style="min-width:220px">Campanha<select id="dc">${S.campaigns.map(x=>`<option value="${x.id}" ${x.id===c.id?'selected':''}>${esc(x.titulo)}</option>`).join('')}</select></label>
  </div>
  <div class="detail">
    <div class="grid">
      <div class="stage" id="stage">
        <div class="eyebrow" style="color:var(--brand-ink);opacity:.8">${style==='bingo'?'Globo do bingo':'Roleta de números'} · ${int(el2.left.length)} números elegíveis</div>
        ${style==='bingo'?`<div class="ball" id="ball">${last?pad(last.numero,c):'?'}</div>`:
          `<div class="reel" id="reel">${(last?pad(last.numero,c):'?'.repeat(digits)).split('').map(d=>`<div class="digit">${d}</div>`).join('')}</div>`}
        <div id="winnerBox">${last?winnerCard(last,c,cd.length):'<p style="opacity:.85">Pronto para sortear entre os números com pagamento confirmado.</p>'}</div>
        <div class="row" style="justify-content:center">
          <button class="btn-a" id="go" ${el2.left.length&&!running?'':'disabled'}>${cd.length?'Sortear próximo número':'Iniciar sorteio agora'}</button>
          <div class="seg" role="group" aria-label="Estilo"><button data-style="roleta" aria-pressed="${style==='roleta'}">Roleta</button><button data-style="bingo" aria-pressed="${style==='bingo'}">Bingo</button></div>
        </div>
      </div>
      ${style==='bingo'&&cd.length?`<div class="panel grid"><h3>Bolas sorteadas, em ordem</h3><div class="tray">${cd.map((d,i)=>`<span class="${i===0?'first':''}" title="${i+1}º sorteado">${pad(d.numero,c)}</span>`).join('')}</div><p class="small muted">A primeira bola sorteada é a ganhadora do prêmio principal.</p></div>`:''}
      <div class="panel grid">
        <div class="row between"><h3>Números participantes elegíveis</h3><span class="small muted">${int(el2.left.length)} de ${int(el2.all.length)} pagos ainda no sorteio</span></div>
        <div class="chips">${el2.all.map(x=>`<span class="${el2.drawn.has(x.n)?'out':''}">${pad(x.n,c)}</span>`).join('')||'<span class="muted" style="background:none">Nenhum número pago ainda.</span>'}</div>
        <p class="small muted">Só entram números de pedidos com pagamento confirmado. Pendentes e cancelados ficam de fora. Cada número só pode sair uma vez.</p>
      </div>
    </div>
    <div class="grid sticky">
      <form class="panel grid" id="sched">
        <h3>Regra de início</h3>
        <div class="radio"><label><input type="radio" name="modo" value="manual" ${c.modo==='manual'?'checked':''}> Manual</label><label><input type="radio" name="modo" value="agendado" ${c.modo==='agendado'?'checked':''}> Agendado</label></div>
        <label ${c.modo==='agendado'?'':'hidden'} id="sc-w">Data e hora<input id="sc-at" name="at" type="datetime-local" value="${c.drawAt?toLocalInput(c.drawAt):''}"></label>
        <div id="countdown" class="mono"></div>
        <button class="btn-sm" type="submit">Salvar regra</button>
        <p class="small muted">No modo agendado, o sorteio começa sozinho no horário, com esta tela aberta. No sistema final isso roda no servidor.</p>
      </form>
      <div class="panel grid">
        <h3>Histórico de resultados</h3>
        ${S.draws.length?`<div class="tablewrap" style="border:0"><table><thead><tr><th>Quando</th><th>Campanha</th><th>Nº</th><th>Ganhador</th></tr></thead><tbody>${S.draws.slice().sort((a,b)=>b.em-a.em).map(d=>{const cc=S.campaigns.find(x=>x.id===d.campaignId);return `<tr><td class="num small">${dt(d.em)}</td><td class="small">${esc(cc?.titulo||'—')}</td><td class="mono">${cc?pad(d.numero,cc):d.numero}</td><td>${esc(d.nome)}<br><span class="small muted mono">${maskPhone(d.fone)} · ${d.origem}</span></td></tr>`}).join('')}</tbody></table></div>`:'<p class="muted small">Nenhum sorteio realizado ainda.</p>'}
        ${cd.length?`<button class="btn-sm btn-g" id="undo">Anular último resultado desta campanha</button>`:''}
      </div>
    </div>
  </div>`;
  $('#dc').onchange=e=>{S.ui.drawCamp=e.target.value;save();rSorteio()};
  $$('[data-style]',el).forEach(b=>b.onclick=()=>{if(running)return;c.estilo=b.dataset.style;save();rSorteio()});
  $('#go').onclick=()=>runDraw(c,'manual');
  const f=$('#sched');
  $$('input[name="modo"]',f).forEach(r=>r.onchange=()=>$('#sc-w').hidden=r.value!=='agendado'||!r.checked);
  f.onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(f));
    if(d.modo==='agendado'){if(!d.at){toast('Informe a data e hora');return}c.drawAt=new Date(d.at).getTime();c.autoFeito=false}
    c.modo=d.modo;save();rSorteio();toast('Regra salva')};
  let armed=false;const u=$('#undo');if(u)u.onclick=()=>{if(!armed){armed=true;u.textContent='Clique de novo para anular';return}
    const ds=S.draws.filter(d=>d.campaignId===c.id).sort((a,b)=>b.em-a.em);S.draws=S.draws.filter(d=>d!==ds[0]);save();rSorteio();toast('Resultado anulado (fica registrado no log do sistema final)')};
  tickCountdown();
}
function toLocalInput(t){const d=new Date(t),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`}
function winnerCard(d,c,i){return `<div class="winner"><span class="eyebrow">${i}º número sorteado</span><strong style="font-size:1.25rem">${esc(d.nome)}</strong><span class="small muted mono">Nº ${pad(d.numero,c)} · ${maskPhone(d.fone)} · pedido ${esc(d.orderId)}</span></div>`}
function runDraw(c,origem){
  if(running)return;const {left}=eligible(c);if(!left.length){toast('Não há números elegíveis');return}
  running=true;$('#go').disabled=true;
  const pick=left[rnd(left.length)];
  const stage=$('#stage');stage.classList.add('spin');
  const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const dur=reduced?400:(c.estilo==='bingo'?2800:3800);const t0=performance.now();
  const show=n=>{const s=pad(n,c);if(c.estilo==='bingo'){$('#ball').textContent=s}else{$$('#reel .digit').forEach((d,i)=>d.textContent=s[i])}};
  $('#winnerBox').innerHTML='<p style="opacity:.85">Sorteando…</p>';
  (function step(){
    const t=performance.now()-t0;
    if(t<dur){show(left[rnd(left.length)].n);setTimeout(step,40+Math.pow(t/dur,3)*260)}
    else{
      show(pick.n);stage.classList.remove('spin');
      S.draws.push({id:uid('S'),campaignId:c.id,numero:pick.n,orderId:pick.o.id,nome:pick.o.nome,fone:pick.o.fone,em:Date.now(),origem:origem==='agendado'?'agendado':'manual',estilo:c.estilo});
      save();running=false;
      setTimeout(()=>{if(current==='sorteio')rSorteio()},reduced?0:900);
      toast(`Número ${pad(pick.n,c)} · ${pick.o.nome}`);
    }
  })();
}
function tickCountdown(){
  const c=S.campaigns.find(x=>x.id===S.ui.drawCamp),box=$('#countdown');
  if(!c||!box)return;
  if(c.modo!=='agendado'||!c.drawAt){box.textContent='';return}
  const ms=c.drawAt-Date.now();
  if(ms>0){const s=Math.floor(ms/1000),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),ss=s%60;
    box.textContent=`Começa em ${d?d+'d ':''}${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`}
  else box.textContent=c.autoFeito?'Sorteio agendado realizado':'Iniciando…';
}
setInterval(()=>{
  if(current!=='sorteio')return;tickCountdown();
  for(const c of S.campaigns)if(c.modo==='agendado'&&c.drawAt&&!c.autoFeito&&Date.now()>=c.drawAt&&c.id===S.ui.drawCamp&&!running){c.autoFeito=true;save();runDraw(c,'agendado')}
},1000);

         [ic.sad,'Danos morais','No valor de até R$ 10.000,00.']]
        .map(([i,t,d])=>`<article><div class="tile">${i}</div><h3>${t}</h3><p>${d}</p></article>`).join('')}
    </div>
  </div>

  <div class="section">
    <div class="eyebrow">Brindes e benefícios</div><h2>Vantagens para associados</h2>
    <div class="grid g3">
      ${[['Sorteios mensais','Associados em dia concorrem a prêmios como pneus, revisões e até moto 0 km.'],['Kit boas-vindas','Rastreador com instalação grátis e kit de emergência no primeiro mês.'],['Clube de descontos','Descontos em postos, lava-rápidos, autopeças e farmácias parceiras.'],['Indique e ganhe','Mensalidade com desconto a cada amigo indicado que se associar.']]
        .map(([t,d])=>`<div class="panel svc"><div class="ic">${ic.gift}</div><h3>${t}</h3><p class="muted small">${d}</p></div>`).join('')}
    </div>
  </div>

  <div class="section">
    <div class="eyebrow">Fotos</div><h2>Nossa estrutura</h2>
    <div class="gallery">${['Fachada da sede','Atendimento ao associado','Frota de guinchos','Entrega de prêmio do sorteio'].map(t=>`<div class="ph"><div>${ic.car}<br>${t}<br><span class="small">substituir pela foto real</span></div></div>`).join('')}</div>
  </div>

  <div class="section">
    <div class="eyebrow">Depoimentos</div><h2>Quem é associado recomenda</h2>
    <div class="grid g3">
      ${[['Meu carro foi furtado numa sexta e na semana seguinte o processo já estava andando. Atendimento rápido pelo WhatsApp.','Marcos R.','motorista de aplicativo · exemplo'],['O guincho chegou em 40 minutos na estrada, à noite, com minha família no carro. Valeu cada mensalidade.','Juliana P.','associada desde 2019 · exemplo'],['Ganhei o jogo de pneus no sorteio de março. Nem acreditei quando ligaram!','Antônio S.','associado desde 2021 · exemplo']]
        .map(([q,n,m])=>`<blockquote class="panel"><p>“${q}”</p><footer><strong>${n}</strong><br><span class="small muted">${m}</span></footer></blockquote>`).join('')}
    </div>
  </div>

  <div class="grid g2">
    <div class="section panel">
      <div class="eyebrow">Perguntas frequentes</div><h2>Tire suas dúvidas</h2>
      <div>
        ${[['Proteção veicular é a mesma coisa que seguro?','Não. Na proteção veicular os associados dividem os custos dos eventos do mês (mutualismo). Por isso a mensalidade costuma ser menor que a de um seguro tradicional.'],
           ['Tem análise de perfil do motorista?','Não. Basta ser habilitado e não estar sob efeito de álcool ou droga. O valor depende do veículo e do plano escolhido.'],
           ['Quando começa a cobertura?','Após a vistoria aprovada e o pagamento da adesão. Roubo e furto podem ter carência conforme o regulamento.'],
           ['Quem pode participar dos sorteios?','Associados com mensalidade em dia e participantes que compram números nas campanhas abertas, conforme o regulamento de cada uma.'],
           ['Como cancelo?','Basta pedir pelo WhatsApp ou na sede. Não há multa de fidelidade após o período mínimo informado no contrato.']]
          .map(([q,a])=>`<details><summary>${q}</summary><p>${a}</p></details>`).join('')}
      </div>
    </div>
    <div class="section panel">
      <div class="eyebrow">Contato</div><h2>Fale com a gente</h2>
      <dl class="contact">
        <div><dt>WhatsApp</dt><dd class="mono" id="wa">${esc(C.whats)}</dd><dd><button class="btn-sm" id="copyWa">Copiar</button> <a class="btn btn-sm btn-p" href="https://wa.me/${C.whatsLink}" target="_blank" rel="noopener">Abrir WhatsApp</a></dd></div>
        <div><dt>E-mail</dt><dd>${esc(C.email)}</dd></div>
        <div><dt>Endereço</dt><dd>${esc(C.endereco)}</dd></div>
        <div><dt>Horário</dt><dd>${esc(C.horario)}</dd></div>
      </dl>
      <h3 style="margin-top:8px">Condições dos serviços</h3>
      <ul class="clean small muted">
        <li>Adesão sujeita a vistoria do veículo e aceite do regulamento da associação.</li>
        <li>Guincho por pane até 1.600 km, limitado a 4 utilizações em 12 meses, pelo trajeto de 400 km. Guincho ilimitado em caso de colisão.</li>
        <li>Vidros com contribuição de até 75% e chaveiro, cada um limitado a uma utilização a cada 12 meses.</li>
        <li>Carro reserva de até 10 dias em caso de colisão.</li>
        <li>Veículos com até 25 anos de fabricação; carros de leilão sob análise.</li>
        <li>Sorteios seguem regulamento próprio de cada campanha e a legislação vigente.</li>
      </ul>
    </div>
  </div>
  <p class="small muted">© ${new Date().getFullYear()} ${esc(C.nome)} · CNPJ 00.000.000/0001-00 (exemplo)</p>`;
  $('#copyWa').onclick=()=>{navigator.clipboard?.writeText(C.whats).then(()=>toast('Número copiado'),()=>toast('Selecione o número para copiar'))};
}

/* ---------- início ---------- */
const h=(location.hash||'').slice(1);
go(VIEWS.includes(h)?h:'sorteios');
})();
</script>
